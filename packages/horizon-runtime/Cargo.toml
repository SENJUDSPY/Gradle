[package]
name = "horizon-runtime"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Horizon runtime support for AstralRinth: release management, requirement verification, client/server process execution"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync"] }
tracing = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
